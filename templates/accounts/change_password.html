
{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->
<section class="section-content padding-y bg">

    {% include 'includes/alerts.html' %}

    <div class="container">
        <div class="row">

            {% include 'includes/dashboard_sidebar.html' %}

            <main class="col-md-9">

                <article class="card">

                    <header class="card-header">
                        <strong class="d-inline-block mr-3">
                            Change Password
                        </strong>
                        <span>{{ user.full_name }}</span>
                    </header>

                    <div class="card-body">

                        <form action="{% url 'change_password' %}"
                              method="POST">

                            {% csrf_token %}

                            <!-- Current Password -->
                            <div class="form-group">
								
                                <label for="current_password">
                                    Current Password
                                </label>

                                <input type="password"
                                       name="current_password"
                                       id="current_password"
                                       class="form-control"
                                       placeholder="Enter current password"
                                       autocomplete="current-password"
                                       required>
                            </div>

                            <!-- New Password -->
                            <div class="form-group">
                                <label for="password">
                                    New Password
                                </label>

                                <input type="password"
                                       name="password"
                                       id="password"
                                       class="form-control"
                                       placeholder="Enter new password"
                                       autocomplete="new-password"
                                       required>
                            </div>

                            <!-- Confirm Password -->
                            <div class="form-group">
                                <label for="confirm_password">
                                    Confirm New Password
                                </label>

                                <input type="password"
                                       name="confirm_password"
                                       id="confirm_password"
                                       class="form-control"
                                       placeholder="Confirm new password"
                                       autocomplete="new-password"
                                       required>
                            </div>

                            <!-- Submit Button -->
                            <div class="form-group mt-4">

                                <button type="submit"
                                        class="btn btn-primary btn-block">
                                    Change Password
                                </button>

                            </div>

                        </form>

                    </div> <!-- card-body -->

                </article>

            </main>

        </div> <!-- row -->
    </div> <!-- container -->

</section>
<!-- ========================= SECTION CONTENT END ========================= -->

{% endblock content %}
