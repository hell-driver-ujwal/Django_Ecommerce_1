
{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section-content padding-y bg">
  <div class="container">

    <form action="{% url 'home' %}" method="post">
      {% csrf_token %}

      <div class="row">

        <!-- LEFT SIDE: BILLING ADDRESS -->
        <aside class="col-lg-6 mb-4">
          <div class="card">
            <div class="card-body">

              <h4 class="card-title">Billing Address</h4>

              <div class="form-row">
                <div class="col form-group">
                  <label>First Name</label>
                  <input type="text" name="first_name"
                         class="form-control" required>
                </div>

                <div class="col form-group">
                  <label>Last Name</label>
                  <input type="text" name="last_name"
                         class="form-control" required>
                </div>
              </div>

              <div class="form-row">
                <div class="col form-group">
                  <label>Email</label>
                  <input type="email" name="email"
                         class="form-control" required>
                </div>

                <div class="col form-group">
                  <label>Phone Number</label>
                  <input type="text" name="phone"
                         class="form-control" required>
                </div>
              </div>

              <div class="form-row">
                <div class="col form-group">
                  <label>Address Line 1</label>
                  <input type="text" name="address_line_1"
                         class="form-control" required>
                </div>

                <div class="col form-group">
                  <label>Address Line 2</label>
                  <input type="text" name="address_line_2"
                         class="form-control">
                </div>
              </div>

              <div class="form-row">
                <div class="col form-group">
                  <label>Country</label>
                  <input type="text" name="countr"
                         class="form-control" required>
                </div>

                <div class="col form-group">
                  <label>Province</label>
                  <input type="text" name="province"
                         class="form-control" required>
                </div>

                <div class="col form-group">
                  <label>City</label>
                  <input type="text" name="city"
                         class="form-control" required>
                </div>
              </div>

              <div class="form-group">
                <label>Order Note</label>
                <textarea name="order_note"
                          rows="8"
                          cols="80"
                          class="form-control"></textarea>
              </div>

            </div>
          </div>
        </aside>


        <!-- RIGHT SIDE: PRODUCT DETAILS -->
        <aside class="col-lg-6 mb-4">
          <div class="card">
            <div class="card-body">

              <table class="table table-borderless table-shopping-cart">
                <thead class="text-muted">
                  <tr class="small text-uppercase">
                    <th scope="col">Product</th>
                    <th scope="col" width="160">Quantity</th>
                    <th scope="col" width="120">Price</th>
                    <th scope="col" class="text-right" width="140"></th>
                  </tr>
                </thead>

                <tbody>
                  {% for cart_item in cart_items %}
                  <tr>
                    <td>
                      <figure class="itemside align-items-center">
                        <div class="aside">
                          <img src="{{ cart_item.product.images.url }}"
                               alt="{{ cart_item.product.product_name }}"
                               class="img-sm">
                        </div>

                        <figcaption class="info">
                          <a href="{{ cart_item.product.get_url }}"
                             class="title text-dark">
                            {{ cart_item.product.product_name }}
                          </a>

                          <p class="text-muted small">
                            {% for variation in cart_item.variations.all %}
                              {{ variation.variations_category|capfirst }}:
                              {{ variation.variation_value|capfirst }}<br>
                            {% endfor %}
                          </p>
                        </figcaption>
                      </figure>
                    </td>

                    <td>
                      <div class="input-group input-spinner">
                        <input type="text"
                               class="form-control"
                               value="{{ cart_item.quantity }}"
                               aria-label="Quantity"
                               readonly>
                      </div>
                    </td>

                    <td>
                      <div class="price-wrap">
                        <var class="price">
                          ${{ cart_item.sub_total }}
                        </var>
                        <small class="text-muted">
                          ${{ cart_item.product.price }} each
                        </small>
                      </div>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>

              <button type ="submit" name ='submit' class="btn btn-primary btn-block"> Place Order </button>
              
              <a href="{% url 'store' %}"
                 class="btn btn-light btn-block">
                Continue Shopping
              </a>

            </div>
          </div>
        </aside>

      </div>
    </form>

  </div>
</section>
{% endblock content %}
